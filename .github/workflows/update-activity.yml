name: Update weekly activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    paths:
      - ".github/workflows/update-activity.yml"
      - "scripts/generate_activity.py"
      - "assets/mishanya-os-template.svg"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate unified terminal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Commit updated terminal
        run: |
          if git diff --quiet -- assets/mishanya-os-live.svg; then
            echo "No activity changes."
            exit 0
          fi

          git config user.name "mishanya-os[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mishanya-os-live.svg
          git commit -m "chore: update weekly activity"
          git pull --rebase origin main
          git push
